services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  backend:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      PYTHONUNBUFFERED: "1"
      GRIDPULSE_AUDIT_DB: /app/data/audit_log.db
    volumes:
      - ./data:/app/data
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped
volumes:
  falkordb_data:
