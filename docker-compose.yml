services:
  falkordb:
    image: falkordb/falkordb@sha256:107455e862a824e45e8e9f5a7fbfdf5e00a08b14e13eae2577c72fd9e3f59ba6
    ports:
      - "127.0.0.1:${FALKORDB_HOST_PORT:-6379}:6379"
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  backend:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      PYTHONUNBUFFERED: "1"
      GRIDPULSE_AUDIT_DB: /app/data/audit_log.db
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GRIDPULSE_AGENT_MODEL: ${GRIDPULSE_AGENT_MODEL:-openai/gpt-oss-120b}
    volumes:
      - ./data:/app/data
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped
volumes:
  falkordb_data:
